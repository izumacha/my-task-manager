[project]
name = "my-task-manager"
version = "0.2.0"
description = "1日のタスクをカレンダー（デイビュー）で可視化し、空き時間と「あとでやる」を扱うデスクトップ・タスクプランナー（Python + tkinter）。Any Planner を参考に、完了時点を起点とした繰り返し（日/週/月/年）に対応"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["task-manager", "planner", "timeline", "calendar", "gui", "tkinter", "desktop", "recurrence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
# ウィンドウアイコン（SVG→PNG 変換）専用のオプション依存。
# 未インストールでも reminder/notifications.py の _set_window_icon() が
# ImportError を捕捉してアイコン設定をスキップするだけで、アプリ本体は問題なく動作する。
icon = [
  "cairosvg>=2.9.1",
]

[project.urls]
Homepage = "https://github.com/izumacha/my-task-manager"
Repository = "https://github.com/izumacha/my-task-manager"

[project.scripts]
reminder = "reminder:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# setuptools のフラットレイアウト自動検出は contract/ もトップレベルパッケージとみなして
# 「複数パッケージを検出した」とビルドを拒否する（contract はコードではなくテスト専用の
# データディレクトリで、実際に配布すべき Python パッケージは reminder/ のみ）。
# 明示的に列挙することで pip install -e . / pipx install が失敗する問題を解消する。
packages = ["reminder"]

[tool.setuptools.package-data]
# reminder/assets/reminder_icon.svg（ウィンドウアイコン用 SVG）を wheel/sdist に同梱する。
# これが無いと `pip install`/`pipx install` の通常インストール後に
# reminder/notifications.py::_set_window_icon() が参照するファイルが存在せず、
# cairosvg を入れてもアイコン設定が常に黙ってスキップされてしまう。
reminder = ["assets/*.svg"]


# ---------------------------------------------------------------------------
# ruff: lint（静的解析）設定
# ---------------------------------------------------------------------------
[tool.ruff]
# 注: target-version は指定しない。ruff は上の requires-python = ">=3.10" から
#     自動で推論する（`ruff check --show-settings` で 3.10 と確認済み）。ここに数字を
#     書くと、将来 requires-python を上げたときに古い値が推論に勝って黙って食い違う。
# 注: exclude は指定しない。build / dist / .venv は ruff の既定 exclude に既に含まれており、
#     書き足すと「既定を上書きした」ように読めて、既定側が変わったときに追随できなくなる。
# 注: line-length も指定しない。下の ignore で E501（行長超過）を無効にしており、
#     行長を見る他のルール（W505）も未選択、`ruff format` も CI に無いため、
#     値を書いても実際には誰も参照しない死んだ設定になるため（§6 デッドコードを残さない）。
#     将来 `ruff format` を導入するときに、その PR で line-length も一緒に決める。

[tool.ruff.lint]
select = [
  "E",    # pycodestyle エラー（インデント、空白などの基本的な規約違反）
  "F",    # Pyflakes（未使用 import、未定義変数など「実バグになりうる」検出）
  "W",    # pycodestyle 警告（行末空白など）
  "I",    # isort（import の並び順を統一）
  "UP",   # pyupgrade（古い書き方を新しい構文へ。target-version に追従）
  "B",    # flake8-bugbear（可変デフォルト引数など、よくある論理バグ）
  "SIM",  # flake8-simplify（冗長な if / with のネストを簡潔に）
]
ignore = [
  # 行長超過。CLAUDE.md §5 が「実行行 1 行ごとに日本語コメントを添える」ことを求めており、
  # 行末コメントの分だけ行が伸びるのは本リポジトリでは正常な状態（現に 1,600 行以上が
  # 100 文字を超えている）。ここを有効にすると新規コードの指摘ではなく既存コードの
  # ノイズで埋まるため、行長は機械的には強制しない、という意図的な選択。
  "E501",
]

# per-file-ignores は現時点で不要なため置かない。
# 「将来使うかもしれない」ignore を先回りで足すと、なぜ必要なのか読み手に伝わらないまま
# 残り続けて検出網を静かに緩めるので、実際に違反が出た時点で理由と一緒に追加する。

# ---------------------------------------------------------------------------
# mypy: 型検査設定
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
# 型検査の対象プラットフォームを固定する。未指定だと mypy は実行中の OS を見るため、
# OS ごとに分岐する箇所（notifications.py の winsound など）の結果が手元と CI で食い違い、
# 「ある OS でだけ warn_unused_ignores が誤発火する」不安定な状態になる。
# CI の quality ジョブは ubuntu-latest なので linux に揃える。
platform = "linux"
# パッケージ全体を既定で検査対象にする（denylist 方式）。
# 対象を 1 ファイルずつ列挙する allowlist 方式にすると、新しく追加した純粋ロジック
# モジュールを列挙へ足し忘れたときに「黙って検査対象外」になり、明らかな型エラーでも
# CI が緑のまま通ってしまう（＝足し忘れが唯一かつ無警告の失敗モードになる）。
# 逆にここを既定 ON にしておけば、新規ファイルは自動的に検査され、外したいときだけ
# 下の overrides に理由付きで明示する必要が生じる（fail-closed）。
files = ["reminder"]
warn_unused_ignores = true       # 不要になった # type: ignore を検出して腐敗を防ぐ
# 注釈が 1 つも無い関数の「中身」も検査する。mypy の既定は、引数にも戻り値にも注釈が無い
# 関数の本体を丸ごと飛ばす（＝中に型エラーを書いても素通りする）。
# 現時点で reminder/ にそういう関数は無い（app.py の _on_timeline_resize /
# _on_timeline_click / _rounded_rect や __init__.py の __getattr__ は引数か戻り値の
# どちらかに注釈があるため、既定でも本体は検査されている。実測で確認済み）。
# つまりこの設定は今の検出結果を変えないが、`def f(a, b):` を新しく足したときに
# その本体が無警告で検査対象外になるのを防ぐ fail-closed の保険として有効にしておく
# （検査対象をモジュール単位で fail-closed にしている denylist 方式と同じ考え方）。
check_untyped_defs = true
warn_redundant_casts = true      # 意味のない cast() を検出
no_implicit_optional = true      # 既定値 None の引数に暗黙の Optional を付けない（明示を強制）
# 注: ignore_missing_imports はグローバルには有効にしない。全体に効かせると、
#     将来スタブが要る依存を足したときに「型が付いていない」ことを黙って握り潰すため。
#     スタブが無い依存は下の overrides でモジュール単位に限定して許可する。

# 注: 自リポジトリのモジュールに除外は無い（reminder/ は app.py を含め全モジュールが対象）。
#     下の cairosvg が唯一の overrides で、これは import 解決の許可であって
#     エラーの無視ではない。**モジュールを ignore_errors で外すのは最後の手段**とし、
#     まず型で不変条件を表せないかを検討する（実例と経緯は CLAUDE.md §2 に集約）。

# cairosvg は型スタブを提供していないオプション依存で、quality ジョブでは
# インストールもされない（requirements-dev.txt に無い）。この 1 モジュールに限って
# インポート解決の失敗を許可する（ImportError 時に graceful degradation する設計）。
# 実際に効いていることは確認済み: この override を消すと
# notifications.py:18 で import-not-found が出る。
[[tool.mypy.overrides]]
module = ["cairosvg.*"]
ignore_missing_imports = true
